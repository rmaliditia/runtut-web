name: Full Code Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    # 1. Ambil kodingan dari repository
    - name: Checkout Code
      uses: actions/checkout@v3
    
    # 2. Siapkan PHP untuk cek Backend
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        
    # 3. Cek Syntax PHP (Backend)
    - name: Check PHP Syntax
      run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

    # 4. Siapkan Node.js (Diperlukan untuk alat cek JS/CSS)
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    # 5. Install alat pengecek (JSHint & CSSLint)
    - name: Install Linters
      run: npm install -g jshint csslint

    # 6. Cek Syntax JavaScript (Frontend Logic)
    # Mencari semua file .js dan mengeceknya
    - name: Check JavaScript Syntax
      run: find . -name "*.js" -print0 | xargs -0 -n1 jshint
