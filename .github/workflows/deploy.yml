name: Auto Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}      # Nanti diisi di Settings > Secrets
        username: ${{ secrets.SERVER_USER }} # Biasanya 'root' atau 'ubuntu'
        key: ${{ secrets.SSH_PRIVATE_KEY }}  # Private key dari SysAdmin
        port: 22
        script: |
          # Masuk ke folder web server (path ini tanya ke SysAdmin)
          cd /var/www/html 
          
          # Tarik perubahan terbaru dari git
          # (Opsi 1: Jika server install git)
          git pull origin main
          
          # ATAU (Opsi 2: Timpa file langsung dari GitHub tanpa git di server)
          # Ini lebih tricky, untuk Level 2 gunakan Opsi 1 saja biar mudah.
